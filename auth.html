<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfterGlow - Authentication</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        .btn-google {
            width: 100% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 0.75rem !important;
            padding: 1rem 1.2rem !important;
            border-radius: 1rem !important;
            border: 1px solid var(--glass-border) !important;
            background: rgba(255, 255, 255, 0.03) !important;
            color: var(--white) !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: var(--transition) !important;
            font-size: 1.05rem !important;
            margin-bottom: 0.5rem !important;
            font-family: 'Outfit', sans-serif !important;
        }
        .btn-google:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05) !important;
            transform: translateY(-2px) !important;
        }
        .btn-google i {
            color: var(--white) !important;
            font-size: 1.2rem !important;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 500;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--glass-border);
        }
        .auth-divider:not(:empty)::before {
            margin-right: .75em;
        }
        .auth-divider:not(:empty)::after {
            margin-left: .75em;
        }
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <i class="fas fa-camera-retro"></i>
                    <span>AfterGlow</span>
                </a>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
                <a href="upload.html"><i class="fas fa-upload"></i> Upload</a>
                <a href="auth.html" class="active"><i class="fas fa-sign-in-alt"></i> Login</a>
            </div>
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="auth-section">
        <div class="auth-card">
            <h2 class="auth-title" id="auth-title">Welcome Back</h2>
            <div id="auth-error"></div>
            <div id="auth-message" class="auth-message"></div>
            <button id="google-signin" type="button" class="btn btn-google">
                <i class="fab fa-google"></i>
                Continue with Google
            </button>
            <div class="auth-divider" id="auth-divider">
                <span>or</span>
            </div>
            <div class="auth-forms-container">
                <form id="login-form" class="auth-form form-active">
                    <div class="form-group">
                        <label>Email or Username</label>
                        <input type="text" id="login-user" required placeholder="Enter your email or username">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-primary"
                        style="width: 100%; justify-content: center;">Login</button>
                    <div class="auth-toggle">
                        <a onclick="showForm('reset-form')">Forgot password?</a>
                    </div>
                    <div class="auth-toggle">
                        Don't have an account? <a onclick="showForm('register-form')">Sign up</a>
                    </div>
                </form>

                <form id="register-form" class="auth-form form-hidden-right">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="reg-username" required placeholder="Choose a username">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" required placeholder="Choose a secure password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Create Account</button>
                    <div class="auth-toggle">
                        Already have an account? <a onclick="showForm('login-form')">Login</a>
                    </div>
                </form>

                <form id="reset-form" class="auth-form form-hidden-right">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reset-email" required placeholder="Enter your email">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Send Reset Link</button>
                    <div class="auth-toggle">
                        Remembered your password? <a onclick="showForm('login-form')">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        const nextPage = new URLSearchParams(window.location.search).get('next') || 'profile.html';

        const firebaseConfig = {
            apiKey: "AIzaSyDHDN6BGOcbFGdJcwY4-gHzQIp6GUgciTw",
            authDomain: "afterglow-pics.firebaseapp.com",
            projectId: "afterglow-pics",
            storageBucket: "afterglow-pics.firebasestorage.app",
            messagingSenderId: "1090843874160",
            measurementId: "G-RKK3JDQSLB",
            appId: "1:1090843874160:web:178cdb6440f8e6d0d4f5b5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        function showForm(formId) {
            document.getElementById('auth-error').innerText = '';
            document.getElementById('auth-message').innerText = '';
            document.getElementById('login-form').style.display = formId === 'login-form' ? 'flex' : 'none';
            document.getElementById('register-form').style.display = formId === 'register-form' ? 'flex' : 'none';
            document.getElementById('reset-form').style.display = formId === 'reset-form' ? 'flex' : 'none';
            document.getElementById('auth-title').innerText = formId === 'register-form' ? 'Create Account' : formId === 'reset-form' ? 'Reset Password' : 'Welcome Back';
            
            // Hide Google Sign-in and divider when on Reset Password page
            const isReset = formId === 'reset-form';
            document.getElementById('google-signin').style.display = isReset ? 'none' : 'inline-flex';
            document.getElementById('auth-divider').style.display = isReset ? 'none' : 'flex';
        }

        function showMessage(message, type = 'error') {
            const container = document.getElementById('auth-message');
            container.innerText = message;
            container.style.color = type === 'success' ? '#34d399' : '#f97316';
        }

        function getFirebaseErrorMessage(err) {
            if (!err || !err.code) return err.message || 'Authentication failed.';
            switch (err.code) {
                case 'auth/user-not-found':
                    return 'No account found with this email.';
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    return 'Incorrect email or password.';
                case 'auth/email-already-in-use':
                    return 'An account with this email already exists.';
                case 'auth/weak-password':
                    return 'Password is too weak. Please use at least 6 characters.';
                case 'auth/invalid-email':
                    return 'Please enter a valid email address.';
                case 'auth/popup-closed-by-user':
                    return 'Sign-in popup was closed before completion.';
                case 'auth/network-request-failed':
                    return 'Network error. Please check your internet connection.';
                default:
                    return err.message;
            }
        }

        async function syncWithBackend(idToken, customUsername) {
            const res = await fetch('/api/auth/firebase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken, username: customUsername })
            });
            const text = await res.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                throw new Error('Server returned non-JSON response.');
            }
            if (!res.ok) {
                throw new Error(data.error || 'Backend session sync failed.');
            }
            localStorage.setItem('ag_token', data.token);
            window.location.href = nextPage;
        }

        document.getElementById('google-signin').addEventListener('click', async () => {
            document.getElementById('auth-error').innerText = '';
            try {
                const result = await auth.signInWithPopup(provider);
                const idToken = await result.user.getIdToken();
                await syncWithBackend(idToken);
            } catch (err) {
                console.error('Google sign-in error:', err);
                document.getElementById('auth-error').innerText = getFirebaseErrorMessage(err);
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('auth-error').innerText = '';
            const loginVal = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Logging in...';

            try {
                let emailToUse = loginVal;
                if (!loginVal.includes('@')) {
                    const lookupRes = await fetch(`/api/auth/lookup-email?username=${encodeURIComponent(loginVal)}`);
                    const lookupData = await lookupRes.json();
                    if (!lookupRes.ok) {
                        throw new Error(lookupData.error || 'No account found with this username.');
                    }
                    emailToUse = lookupData.email;
                }

                const cred = await auth.signInWithEmailAndPassword(emailToUse, pass);
                const idToken = await cred.user.getIdToken();
                await syncWithBackend(idToken);
            } catch (err) {
                console.error('Login error:', err);
                document.getElementById('auth-error').innerText = getFirebaseErrorMessage(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Login';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('auth-error').innerText = '';
            const emailVal = document.getElementById('reg-email').value.trim();
            const usernameVal = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Creating Account...';

            try {
                const cred = await auth.createUserWithEmailAndPassword(emailVal, pass);
                if (usernameVal) {
                    await cred.user.updateProfile({ displayName: usernameVal });
                }
                const idToken = await cred.user.getIdToken();
                await syncWithBackend(idToken, usernameVal);
            } catch (err) {
                console.error('Registration error:', err);
                document.getElementById('auth-error').innerText = getFirebaseErrorMessage(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Create Account';
            }
        });

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('auth-error').innerText = '';
            const email = document.getElementById('reset-email').value.trim();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Sending...';

            try {
                await auth.sendPasswordResetEmail(email);
                showMessage('Password reset link sent to ' + email + '.', 'success');
            } catch (err) {
                console.error('Password reset error:', err);
                document.getElementById('auth-error').innerText = getFirebaseErrorMessage(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Send Reset Link';
            }
        });

        showForm('login-form');
    </script>
</body>

</html>
