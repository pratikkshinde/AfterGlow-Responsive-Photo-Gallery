<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfterGlow — Exhibition Gallery</title>
    <meta name="description" content="Explore fragments of feeling — a curated open exhibition of fine-art photography and shared visual memories on AfterGlow.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Ambient Background Lighting -->
    <div class="ambient-glow ambient-glow-1"></div>
    <div class="ambient-glow ambient-glow-2"></div>

    <!-- Navigation Bar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <i class="fas fa-camera-retro"></i>
                    <span>AfterGlow</span>
                </a>
            </div>
            
            <div class="nav-links" id="navLinks">
                <div class="nav-drawer-header">
                    <div class="nav-drawer-brand">
                        <i class="fas fa-camera-retro"></i>
                        <span>AfterGlow</span>
                    </div>
                    <button type="button" class="nav-drawer-close" id="navDrawerClose" aria-label="Close menu">
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>
                <div class="nav-search">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="global-search" placeholder="Search creators...">
                    <div class="search-dropdown"></div>
                </div>
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="gallery.html" class="active"><i class="fas fa-images"></i> Gallery</a>
                <a href="upload.html"><i class="fas fa-upload"></i> Upload</a>
                <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
            </div>
            
            <div class="hamburger" id="hamburger" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </div>
        </div>
        <div class="nav-backdrop" id="navBackdrop"></div>
    </nav>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <div class="container">
            <div class="gallery-header">
                <span class="gallery-eyebrow"><i class="fas fa-camera"></i> Curated Exhibition</span>
                <h1 class="gallery-title">Fragments of Feeling</h1>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                <!-- Skeleton Shimmer Placeholders while collection loads -->
                <div class="gallery-skeleton-card ag-skeleton-shimmer">
                    <div class="gallery-skeleton-footer"><div class="gallery-skeleton-avatar"></div><div class="gallery-skeleton-handle"></div></div>
                </div>
                <div class="gallery-skeleton-card ag-skeleton-shimmer">
                    <div class="gallery-skeleton-footer"><div class="gallery-skeleton-avatar"></div><div class="gallery-skeleton-handle"></div></div>
                </div>
                <div class="gallery-skeleton-card ag-skeleton-shimmer">
                    <div class="gallery-skeleton-footer"><div class="gallery-skeleton-avatar"></div><div class="gallery-skeleton-handle"></div></div>
                </div>
                <div class="gallery-skeleton-card ag-skeleton-shimmer">
                    <div class="gallery-skeleton-footer"><div class="gallery-skeleton-avatar"></div><div class="gallery-skeleton-handle"></div></div>
                </div>
                <div class="gallery-skeleton-card ag-skeleton-shimmer">
                    <div class="gallery-skeleton-footer"><div class="gallery-skeleton-avatar"></div><div class="gallery-skeleton-handle"></div></div>
                </div>
                <div class="gallery-skeleton-card ag-skeleton-shimmer">
                    <div class="gallery-skeleton-footer"><div class="gallery-skeleton-avatar"></div><div class="gallery-skeleton-handle"></div></div>
                </div>
                <div class="gallery-skeleton-card ag-skeleton-shimmer">
                    <div class="gallery-skeleton-footer"><div class="gallery-skeleton-avatar"></div><div class="gallery-skeleton-handle"></div></div>
                </div>
                <div class="gallery-skeleton-card ag-skeleton-shimmer">
                    <div class="gallery-skeleton-footer"><div class="gallery-skeleton-avatar"></div><div class="gallery-skeleton-handle"></div></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Cinematic Lightbox Modal -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo exhibition viewer">
        <button type="button" class="close-lightbox" aria-label="Close viewer">
            <i class="fas fa-xmark"></i>
        </button>
        <div class="lightbox-hotkeys-hint">
            <span class="hk-chip"><kbd>←</kbd><kbd>→</kbd> Navigate</span>
            <span class="hk-sep">•</span>
            <span class="hk-chip"><kbd>L</kbd> Like</span>
            <span class="hk-sep">•</span>
            <span class="hk-chip"><kbd>S</kbd> Share</span>
            <span class="hk-sep">•</span>
            <span class="hk-chip"><kbd>D</kbd> Download</span>
            <span class="hk-sep">•</span>
            <span class="hk-chip"><kbd>F</kbd> Fullscreen</span>
            <span class="hk-sep">•</span>
            <span class="hk-chip"><kbd>Esc</kbd> Close</span>
        </div>
        <button type="button" class="lightbox-nav-btn prev-btn" id="galleryLightboxPrev" onclick="navigateGalleryLightbox(-1)" aria-label="Previous photograph">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button type="button" class="lightbox-nav-btn next-btn" id="galleryLightboxNext" onclick="navigateGalleryLightbox(1)" aria-label="Next photograph">
            <i class="fas fa-chevron-right"></i>
        </button>

        <!-- Center Stage with Image & Integrated Bottom Overlay -->
        <div class="lightbox-stage" id="lightboxStage">
            <img class="lightbox-content" id="lightboxImage" src="" alt="Photographic art full view">
            <div class="lightbox-dock-overlay" id="galleryLightboxBottomBar">
                <div id="lightboxCaption" class="lightbox-dock-left"></div>
                <div class="lightbox-dock-right">
                    <button type="button" class="lightbox-icon-btn lightbox-like-btn" id="galleryLightboxLikeBtn" onclick="toggleCurrentGalleryPhotoLike()" title="Like photograph" aria-label="Like">
                        <i class="far fa-heart" id="galleryLightboxHeartIcon"></i>
                        <span class="lightbox-like-count" id="galleryLightboxLikeCount" style="display:none;"></span>
                    </button>
                    <button type="button" class="lightbox-icon-btn" onclick="shareCurrentGalleryPhoto()" title="Share photograph" aria-label="Share">
                        <i class="fas fa-share-nodes"></i>
                    </button>
                    <button type="button" class="lightbox-icon-btn" onclick="downloadCurrentGalleryPhoto()" title="Download photograph" aria-label="Download">
                        <i class="fas fa-download"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-top-row">
                <div class="footer-brand">
                    <i class="fas fa-camera-retro"></i>
                    <span>AfterGlow</span>
                </div>
                <a href="#" class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;" aria-label="Back to top" title="Back to top">
                    <span class="back-to-top-text">Back to top</span>
                    <i class="fas fa-arrow-up"></i>
                </a>
            </div>
            <div class="footer-bottom-row">
                <div class="footer-copyright">
                    <span class="copyright-full">Made with &nbsp;<i class="fas fa-heart" style="color: var(--primary-color);"></i>&nbsp; &copy; 2026 AfterGlow. All visual works belong to their respective creators.</span>
                    <span class="copyright-short">&copy; 2026 AfterGlow</span>
                </div>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/pratikraj-shinde" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                    <a href="https://github.com/pratikkshinde" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="https://www.instagram.com/pratikkshinde_/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
