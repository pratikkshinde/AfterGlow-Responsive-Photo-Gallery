<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfterGlow - Profile</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <!-- Ambient Background Lighting -->
    <div class="ambient-glow ambient-glow-1"></div>
    <div class="ambient-glow ambient-glow-2"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <i class="fas fa-camera-retro"></i>
                    <span>AfterGlow</span>
                </a>
            </div>
            <div class="nav-links" id="navLinks">
                <div class="nav-search">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="global-search" placeholder="Search users...">
                    <div class="search-dropdown"></div>
                </div>
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="gallery.html"><i class="fas fa-images"></i> Gallery</a>
                <a href="upload.html"><i class="fas fa-upload"></i> Upload</a>
                <a href="profile.html" class="active" id="nav-profile-link"><i class="fas fa-user-circle"></i> Profile</a>
            </div>
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="gallery-section">
        <div class="profile-header">
            <img id="prof-pic" src="https://via.placeholder.com/150" alt="Profile" class="profile-pic">
            <div class="profile-info">
                <h1 id="prof-username">Loading...</h1>
                <div class="profile-stats">
                    <span><strong id="prof-post-count">0</strong> Posts</span>
                </div>
                <p class="bio" id="prof-bio">No bio available.</p>
                <button class="btn btn-secondary" onclick="openSettings()"><i class="fas fa-cog"></i> Edit Profile</button>
                <button class="btn btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="pin-grid" id="profile-gallery">
            <!-- Loading -->
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <h2>Edit Profile</h2>
            <form id="settings-form">
                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" id="set-pic" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="set-username">
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="set-bio" rows="3"></textarea>
                </div>
                <div class="settings-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Save Changes</button>
                </div>
                <p id="save-status" style="text-align:center; margin-top:0.8rem; font-size:0.9rem; min-height:1.2em;"></p>
            </form>
        </div>
    </div>

    <!-- Lightbox for profile images -->
    <div class="lightbox" id="profileLightbox" style="display:none;">
        <span class="close-lightbox" onclick="closeProfileLightbox()">&times;</span>
        <img class="lightbox-content" id="profileLightboxImg" src="" alt="Full view">
        <div class="lightbox-caption" id="profileLightboxCaption"></div>
    </div>

    <style>
        /* Empty state CTA */
        .profile-empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 2rem;
            margin: 1rem auto;
            max-width: 480px;
        }
        .empty-state-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(236,72,153,0.15), rgba(139,92,246,0.15));
            border: 1px solid rgba(236,72,153,0.2);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            color: var(--primary-color);
        }
        .profile-empty-state h3 {
            font-size: 1.5rem; margin-bottom: 0.75rem; color: var(--white);
        }
        .profile-empty-state p {
            color: var(--text-light); margin-bottom: 1.5rem; line-height: 1.6;
        }
        /* Gallery items on profile are clickable */
        .pin-grid .gallery-item { cursor: pointer; }
    </style>

    <script src="js/main.js"></script>
    <script>
        // Profile Loader Logic
        async function loadProfileData() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetUsername = urlParams.get('username');
            const token = localStorage.getItem('ag_token');

            let myUsername = null;
            if (token) {
                try {
                    const meRes = await fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token }});
                    if (meRes.ok) {
                        const me = await meRes.json();
                        myUsername = me.username;
                    } else if (meRes.status === 401 || meRes.status === 403) {
                        localStorage.removeItem('ag_token');
                        window.location.href = 'auth.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
                        return;
                    }
                } catch(e) {
                    localStorage.removeItem('ag_token');
                }
            }

            // Require login ONLY if trying to view own profile directly
            if (!targetUsername && !token) {
                window.location.href = 'auth.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }

            const isOwner = !targetUsername || targetUsername === myUsername;
            let profileUser = null;
            let photos = [];

            try {
                if (isOwner) {
                    const uRes = await fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token }});
                    if (uRes.status === 401 || uRes.status === 403) {
                        localStorage.removeItem('ag_token');
                        window.location.href = 'auth.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
                        return;
                    }
                    if (uRes.ok) profileUser = await uRes.json();
                    
                    const pRes = await fetch('/api/photos/me', { headers: { 'Authorization': 'Bearer ' + token }});
                    if (pRes.status === 401 || pRes.status === 403) {
                        localStorage.removeItem('ag_token');
                        window.location.href = 'auth.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
                        return;
                    }
                    if (pRes.ok) photos = await pRes.json();
                } else {
                    const uRes = await fetch(`/api/user/public/${targetUsername}`);
                    if (uRes.ok) profileUser = await uRes.json();
                    
                    const pRes = await fetch(`/api/photos/public/${targetUsername}`);
                    if (pRes.ok) photos = await pRes.json();
                }

                if (!profileUser) {
                    alert('User not found!');
                    window.location.href = 'gallery.html';
                    return;
                }

                // Render Profile Headers
                document.getElementById('prof-username').innerText = '@' + profileUser.username;
                document.getElementById('prof-bio').innerText = profileUser.bio || (isOwner ? 'Add a bio...' : 'No bio available.');
                if(profileUser.profile_picture_url) document.getElementById('prof-pic').src = profileUser.profile_picture_url;
                
                document.getElementById('prof-post-count').innerText = photos ? photos.length : 0;

                // Render Photos Grid
                const grid = document.getElementById('profile-gallery');
                if (photos && photos.length > 0) {
                    grid.innerHTML = photos.map((p, index) => `
                        <div class="gallery-item pin-item" data-photo-id="${p.id}" style="--index: ${index}" onclick="openProfileLightbox('${p.src}', '${(p.title || '').replace(/'/g, "\'")}')">
                            <img src="${p.src}" alt="${p.title || 'Memory'}">
                            ${isOwner ? `<button class="delete-btn" onclick="event.stopPropagation(); deletePhoto('${p.id}')"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    `).join('');
                } else {
                    // Rich empty-state CTA
                    const emptyMsg = isOwner
                        ? `<div class="profile-empty-state">
                                <div class="empty-state-icon"><i class="fas fa-images"></i></div>
                                <h3>Share Your Memories</h3>
                                <p>Your gallery is empty. Upload your first photo and let the world see your story.</p>
                                <a href="upload.html" class="btn btn-primary"><i class="fas fa-cloud-upload-alt"></i> Upload Photos</a>
                           </div>`
                        : `<div class="profile-empty-state">
                                <div class="empty-state-icon"><i class="fas fa-camera"></i></div>
                                <h3>No Photos Yet</h3>
                                <p>This user hasn't shared any memories yet.</p>
                           </div>`;
                    grid.innerHTML = emptyMsg;
                }

                // UI Controls
                if (!isOwner) {
                    // Hide Owner actions
                    const editBtn = document.querySelector('.btn-secondary[onclick="openSettings()"]');
                    const logoutBtn = document.querySelector('.btn-logout');
                    if (editBtn) editBtn.style.display = 'none';
                    if (logoutBtn) logoutBtn.style.display = 'none';
                } else {
                    // Pre-fill modal data for owner
                    document.getElementById('set-username').value = profileUser.username;
                    document.getElementById('set-bio').value = profileUser.bio || '';
                }

            } catch (err) {
                console.error("Failed to load profile", err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProfileData();
            if (typeof window.onRealtimePhotoUpdate === 'function') {
                window.onRealtimePhotoUpdate(() => loadProfileData());
            }
        });

        // Settings Logic
        const settingsModal = document.getElementById('settingsModal');
        function openSettings() {
            settingsModal.classList.add('modal-active');
        }
        function closeSettings() {
            settingsModal.classList.remove('modal-active');
        }

        // Close modal when clicking the backdrop
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSettings();
        });

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('ag_token');
            const saveBtn = document.getElementById('save-btn');
            const saveStatus = document.getElementById('save-status');

            // Show loading state
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            saveStatus.style.color = 'var(--text-light)';
            saveStatus.textContent = '';

            const fd = new FormData();
            fd.append('username', document.getElementById('set-username').value);
            fd.append('bio', document.getElementById('set-bio').value);
            const pic = document.getElementById('set-pic').files[0];
            if (pic) fd.append('profilePic', pic);

            try {
                const res = await fetch('/api/user/profile', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: fd
                });
                const data = await res.json();

                if (res.ok) {
                    // Update DOM in-place — no reload needed
                    const newUsername = document.getElementById('set-username').value;
                    const newBio = document.getElementById('set-bio').value;
                    document.getElementById('prof-username').innerText = '@' + newUsername;
                    document.getElementById('prof-bio').innerText = newBio || 'Add a bio...';
                    if (data.profile_picture_url) {
                        document.getElementById('prof-pic').src = data.profile_picture_url;
                    } else if (pic) {
                        // Show local preview immediately if server didn't return URL yet
                        document.getElementById('prof-pic').src = URL.createObjectURL(pic);
                    }

                    saveStatus.style.color = '#34d399';
                    saveStatus.textContent = '✓ Profile saved!';
                    saveBtn.innerHTML = 'Save Changes';
                    saveBtn.disabled = false;

                    // Auto-close modal after short delay
                    setTimeout(() => {
                        closeSettings();
                        saveStatus.textContent = '';
                    }, 1200);
                } else {
                    throw new Error(data.error || 'Save failed');
                }
            } catch (err) {
                saveStatus.style.color = 'var(--danger-color)';
                saveStatus.textContent = '✗ ' + (err.message || 'Could not save. Try again.');
                saveBtn.innerHTML = 'Save Changes';
                saveBtn.disabled = false;
            }
        });

        async function deletePhoto(id) {
            if (!confirm('Remove this photo from your profile?')) return;
            const token = localStorage.getItem('ag_token');
            try {
                const res = await fetch(`/api/photos/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) {
                    // Remove the card from the DOM instantly — no reload
                    const card = document.querySelector(`.gallery-item[data-photo-id="${id}"]`);
                    if (card) {
                        card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.85)';
                        setTimeout(() => card.remove(), 320);
                    }
                    // Update post count
                    const countEl = document.getElementById('prof-post-count');
                    if (countEl) countEl.innerText = Math.max(0, parseInt(countEl.innerText) - 1);
                }
            } catch (err) {
                console.error('Delete error:', err);
            }
        }

        function logout() {
            localStorage.removeItem('ag_token');
            window.location.href = 'index.html';
        }

        // Profile image lightbox
        function openProfileLightbox(src) {
            const lb = document.getElementById('profileLightbox');
            const img = document.getElementById('profileLightboxImg');
            const cap = document.getElementById('profileLightboxCaption');
            img.src = src;
            cap.innerHTML = '';
            lb.style.display = 'flex';
            lb.style.animation = 'fadeIn 0.3s ease forwards';
        }

        function closeProfileLightbox() {
            const lb = document.getElementById('profileLightbox');
            lb.style.animation = 'fadeIn 0.25s ease reverse forwards';
            setTimeout(() => { lb.style.display = 'none'; lb.style.animation = ''; }, 260);
        }

        document.getElementById('profileLightbox').addEventListener('click', function(e) {
            if (e.target === this) closeProfileLightbox();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeProfileLightbox();
                closeSettings();
            }
        });
    </script>
</body>
</html>
